version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: poker_postgres
    environment:
      POSTGRES_USER: poker_user
      POSTGRES_PASSWORD: poker_pass
      POSTGRES_DB: poker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker_user -d poker_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poker_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: poker_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poker_network

  # MinIO (S3-compatible storage) - Optional
  minio:
    image: minio/minio:latest
    container_name: poker_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - poker_network

  # NestJS Backend (will be added once services are ready)
  # backend:
  #   build:
  #     context: ./packages/backend
  #     dockerfile: Dockerfile
  #   container_name: poker_backend
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://poker_user:poker_pass@postgres:5432/poker_db
  #     REDIS_URL: redis://redis:6379
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - poker_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  poker_network:
    driver: bridge
